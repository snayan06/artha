[project]
name = "hisab-api"
version = "0.1.0"
description = "Hisab V1 ledger API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11.0,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.16.0,<2",
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.0.0,<2",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hisab_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["hisab_api"]
