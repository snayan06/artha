name: Bug report
description: Report a reproducible problem using fictional data only.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include real balances, account identifiers, tokens or private screenshots.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Use fictional amounts and account names.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web PWA
        - FastAPI
        - Supabase schema or RLS
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, or Python version
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only fictional data and removed secrets and personal financial information.
          required: true
