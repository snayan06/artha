name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version-file: apps/api/.python-version
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      # pyproject.toml scopes strict mypy to the installed production package.
      - run: uv run mypy
      - run: uv run pytest
      - run: python ../../scripts/check_capture_evals.py
      - run: uv run python -m artha_api.capture_evals --mode validate
      - run: uv run python -m artha_api.feature_evals --mode validate

  database:
    name: Supabase SQL checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "pglast>=7,<8"
      - run: python scripts/check_sql.py

  # CI needs no application secrets: tests and AI contract validation use
  # fakes/in-memory dependencies and never call a hosted model. Production
  # Supabase and Gemini credentials remain deployment-environment secrets.
