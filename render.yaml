services:
  - type: web
    name: artha-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn artha_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ARTHA_ENV
        value: production
      - key: ARTHA_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ARTHA_LLM_PROVIDER
        sync: false
      - key: ARTHA_GEMINI_API_KEY
        sync: false
      - key: ARTHA_GEMINI_MODEL
        value: gemini-3.5-flash-lite
