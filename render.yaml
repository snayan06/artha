services:
  - type: web
    name: hisab-api-preview
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn hisab_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: HISAB_ENV
        value: preview
      - key: HISAB_CORS_ORIGINS
        sync: false
      - key: HISAB_LLM_PROVIDER
        value: disabled
      - key: HISAB_GROQ_API_KEY
        sync: false
